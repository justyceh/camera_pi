name: Build

on: [push, pull_request]   # run on every push and every pull request

jobs:
  build-device:
    runs-on: ubuntu-latest           # fresh Ubuntu VM each run
    steps:
      - uses: actions/checkout@v4    # download your repo's code onto the VM
      - name: Build C++ code
        working-directory: device    # run the next command inside device/
        run: make                    # the same command you'd run yourself